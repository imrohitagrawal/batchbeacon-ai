name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Locked wheel-only bootstrap
        run: |
          python -m pip install uv==0.11.18
          ./scripts/bootstrap.sh
      - name: Install locked browser runtime
        run: uv run --frozen --no-build playwright install --with-deps chromium
      - name: Backend and visual-prototype browser checks
        env:
          BATCHBEACON_BROWSER_CHECKS: '1'
        run: ./scripts/check.sh
      - name: Explicit remaining gates
        run: echo 'Real cloud/model tests, hosted product journeys and release gates are NOT part of this preparation workflow.'
