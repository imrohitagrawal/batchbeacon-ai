<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="730" viewBox="0 0 1220 730" role="img" aria-labelledby="title desc"><title id="title">Label to saved investigation</title><desc id="desc">The worked historical-SFA example uses real model extraction, deterministic checks and explicit confirmation; missing evidence remains in review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#535D71"/></marker></defs><rect width="1220" height="730" fill="#F7F8FA"/><line x1="310.0" y1="125.0" x2="460.0" y2="125.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="315.8" y="103.0" width="138.4" height="19" fill="#F7F8FA"/><text x="385.0" y="117.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Load and extract</text><line x1="730.0" y1="125.0" x2="880.0" y2="125.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="739.75" y="103.0" width="130.5" height="19" fill="#F7F8FA"/><text x="805.0" y="117.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Proposed fields</text><line x1="1015.0" y1="180.0" x2="1015.0" y2="350.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="949.75" y="243.0" width="130.5" height="19" fill="#F7F8FA"/><text x="1015.0" y="257.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Supported match</text><line x1="880.0" y1="405.0" x2="730.0" y2="405.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="716.05" y="383.0" width="177.9" height="19" fill="#F7F8FA"/><text x="805.0" y="397.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Explicit confirmation</text><line x1="460.0" y1="405.0" x2="310.0" y2="405.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="311.85" y="383.0" width="146.3" height="19" fill="#F7F8FA"/><text x="385.0" y="397.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Reload and resume</text><polyline points="1150,125.0 1190,125.0 1190,605.0 1150,605.0" fill="none" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="1061.6" y="516" width="106.80000000000001" height="19" fill="#F7F8FA"/><text x="1115" y="530" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">No clearance</text><rect x="40" y="70" width="270" height="110" rx="12" fill="#FFF3ED" stroke="#173B75" stroke-width="1.5"/><text x="175.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1E253B">1. Choose synthetic label</text><text x="175.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E253B">Real historical SFA notice</text><rect x="460" y="70" width="270" height="110" rx="12" fill="#F1EDFF" stroke="#173B75" stroke-width="1.5"/><text x="595.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#6243B5">2. Gemini proposes fields</text><text x="595.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#6243B5">One bounded ADK workflow</text><rect x="880" y="70" width="270" height="110" rx="12" fill="#E6F2EB" stroke="#173B75" stroke-width="1.5"/><text x="1015.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#20573E">3. Server compares</text><text x="1015.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#20573E">Identity before lot and date</text><rect x="880" y="350" width="270" height="110" rx="12" fill="#FFF3ED" stroke="#173B75" stroke-width="1.5"/><text x="1015.0" y="398.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1E253B">4. Review and confirm</text><text x="1015.0" y="424.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E253B">Explicit simulated hold</text><rect x="460" y="350" width="270" height="110" rx="12" fill="#EAF0F8" stroke="#173B75" stroke-width="1.5"/><text x="595.0" y="398.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1E253B">5. Persist evidence</text><text x="595.0" y="424.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E253B">Firestore-owned action</text><rect x="40" y="350" width="270" height="110" rx="12" fill="#173B75" stroke="#173B75" stroke-width="1.5"/><text x="175.0" y="398.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#FFFFFF">6. Reopen retail queue</text><text x="175.0" y="424.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#FFFFFF">Same saved investigation</text><rect x="880" y="550" width="270" height="110" rx="12" fill="#EAF0F8" stroke="#173B75" stroke-width="1.5"/><text x="1015.0" y="598.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#1E253B">Review required</text><text x="1015.0" y="624.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E253B">Missing, stale or unsupported</text><text x="40" y="710" font-family="Arial,sans-serif" font-size="16" fill="#535D71">BatchBeacon AI · Label to saved investigation · Current synthetic demonstration</text></svg>