<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="730" viewBox="0 0 1220 730" role="img" aria-labelledby="title desc"><title id="title">Cloud Run components and external persistence</title><desc id="desc">A point-in-time component view: authorization precedes admission and extraction; deterministic checks and explicit confirmation precede saving.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#535D71"/></marker></defs><rect width="1220" height="730" fill="#F7F8FA"/><line x1="310.0" y1="125.0" x2="460.0" y2="125.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="307.9" y="103.0" width="154.20000000000002" height="19" fill="#F7F8FA"/><text x="385.0" y="117.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Authorized request</text><line x1="730.0" y1="125.0" x2="880.0" y2="125.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="723.95" y="103.0" width="162.1" height="19" fill="#F7F8FA"/><text x="805.0" y="117.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Reserve before call</text><line x1="1015.0" y1="180.0" x2="1015.0" y2="350.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="933.95" y="243.0" width="162.1" height="19" fill="#F7F8FA"/><text x="1015.0" y="257.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Untrusted proposals</text><line x1="880.0" y1="405.0" x2="730.0" y2="405.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="739.75" y="383.0" width="130.5" height="19" fill="#F7F8FA"/><text x="805.0" y="397.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Eligible result</text><line x1="460.0" y1="405.0" x2="310.0" y2="405.0" stroke="#535D71" stroke-width="2" marker-end="url(#arrow)"/><rect x="315.8" y="383.0" width="138.4" height="19" fill="#F7F8FA"/><text x="385.0" y="397.0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#535D71">Confirm and save</text><rect x="40" y="70" width="270" height="110" rx="12" fill="#173B75" stroke="#173B75" stroke-width="1.5"/><text x="175.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#FFFFFF">Owned request boundary</text><text x="175.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#FFFFFF">Origin, CSRF and expiry</text><rect x="460" y="70" width="270" height="110" rx="12" fill="#E6F2EB" stroke="#173B75" stroke-width="1.5"/><text x="595.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#20573E">Admission controls</text><text x="595.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#20573E">Guest and model reservations</text><rect x="880" y="70" width="270" height="110" rx="12" fill="#F1EDFF" stroke="#173B75" stroke-width="1.5"/><text x="1015.0" y="118.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#6243B5">Bounded ADK workflow</text><text x="1015.0" y="144.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#6243B5">AI proposes label fields</text><rect x="880" y="350" width="270" height="110" rx="12" fill="#E6F2EB" stroke="#173B75" stroke-width="1.5"/><text x="1015.0" y="398.0" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#20573E">Deterministic verifier</text><text x="1015.0" y="424.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#20573E">Identity, lot, date and scope</text><rect x="460" y="350" width="270" height="110" rx="12" fill="#FFF3ED" stroke="#173B75" stroke-width="1.5"/><text x="595.0" y="385.0" font-family="Arial,sans-serif" font-size="19" font-weight