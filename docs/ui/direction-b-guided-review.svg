<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc"><title id="title">B — Guided incident review</title><desc id="desc">Planning wireframe, not a built or approved interface. Synthetic product aliases. Desktop, mobile, recapture and source update states.</desc><rect width="1600" height="1170" fill="#EEF2F5"/><text x="40" y="59.239999999999995" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#162638">BatchBeacon AI</text><rect x="1200" y="30" width="340" height="30" rx="6" fill="#E8EFFF"/><text x="1210" y="49.04" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#215CCC">PLANNING WIREFRAME</text><text x="40" y="118.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#162638">B / Guided incident review</text><text x="40" y="155.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#526578">One decision at a time; a clear capture sequence with persistent source scope and deliberate confirmation.</text><rect x="40" y="190" width="1100" height="622" rx="14" fill="#FFFFFF" stroke="#CBD5DE"/><rect x="1170" y="190" width="390" height="622" rx="24" fill="#FFFFFF" stroke="#CBD5DE"/><text x="64" y="220.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#526578">DESKTOP · SAME SFA DEMO CASE</text><text x="1194" y="220.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#526578">MOBILE · 390 PX CONCEPT</text><rect x="40" y="840" width="745" height="268" rx="12" fill="#FFFFFF" stroke="#CBD5DE"/><rect x="815" y="840" width="745" height="268" rx="12" fill="#FFFFFF" stroke="#CBD5DE"/><text x="64" y="871.18" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#526578">MISSING EVIDENCE STATE</text><text x="839" y="871.18" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#526578">SOURCE UPDATE STATE · UK REPLAY</text><text x="40" y="1143.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">Concept only · Source names use fixture aliases · Every action is simulated · No safety or sale clearance</text><rect x="64" y="244" width="247" height="42" rx="7" fill="#F7F9FB"/><text x="78" y="270.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">1  Source</text><rect x="327" y="244" width="247" height="42" rx="7" fill="#F7F9FB"/><text x="341" y="270.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">2  Capture</text><rect x="590" y="244" width="247" height="42" rx="7" fill="#E8EFFF"/><text x="604" y="270.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#215CCC">3  Compare</text><rect x="853" y="244" width="247" height="42" rx="7" fill="#F7F9FB"/><text x="867" y="270.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">4  Confirm</text><text x="66" y="337.36" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#162638">Compare the captured label</text><text x="66" y="366.9" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#526578">SFA · Singapore · 09 Oct 2026 · historical demo</text><rect x="66" y="393" width="312" height="163" rx="7" fill="#F7F9FB" stroke="#CBD5DE"/><text x="82" y="417.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#526578">SYNTHETIC DEMO LABEL</text><text x="82" y="450.06" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#162638">CHEESE A</text><text x="82" y="477.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#162638">Pack 250 g</text><text x="82" y="502.32" font-family="DejaVu Sans, Arial,