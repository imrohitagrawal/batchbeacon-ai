ize="16" font-weight="700" fill="#FFFFFF">Add clearer photo</text><text x="64" y="1050.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">If both attempts fail, continue to a simulated review request.</text><text x="839" y="919.78" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#162638">Return to comparison after an update</text><text x="839" y="952.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#162638">UK geography changed; the old result is historical.</text><rect x="839" y="978" width="300" height="30" rx="6" fill="#FCEAE6"/><text x="849" y="997.04" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#993930">RENEWED REVIEW REQUIRED</text><rect x="1160" y="979" width="365" height="42" rx="7" fill="#215CCC"/><text x="1175" y="1004.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Compare update 1</text><text x="839" y="1050.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#526578">Review the new evidence before a new confirmation step.</text></svg>
