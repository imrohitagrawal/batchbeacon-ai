[project]
name = "batchbeacon-ai"
version = "0.1.0"
description = "Source-scoped synthetic recall evidence workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pydantic==2.14.1",
  "google-adk==2.12.0",
  "google-cloud-firestore==2.34.1",
  "google-cloud-storage==3.17.1",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "playwright==1.64.0", "ruff==0.17.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "real_service: explicitly authorized real cloud check",
  "real_model: explicitly budgeted inference evaluation",
  "browser: real local browser checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
